<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&amp;family=Noto+Sans+TC:wght@600;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
      .sans { font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif; }
      .shadow { filter: drop-shadow(4px 4px 0px #111111); }
      .deep-shadow { filter: drop-shadow(8px 8px 0px #111111); }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" fill="#e8e6df"/>
  <rect x="20" y="20" width="920" height="500" fill="#f5f4ef" stroke="#111111" stroke-width="3" rx="4" class="deep-shadow"/>

  <!-- Background Grid Dots -->
  <g fill="#d8d6cf" opacity="0.6">
    <circle cx="60" cy="60" r="1.5"/><circle cx="100" cy="60" r="1.5"/><circle cx="140" cy="60" r="1.5"/><circle cx="180" cy="60" r="1.5"/>
    <circle cx="60" cy="100" r="1.5"/><circle cx="100" cy="100" r="1.5"/><circle cx="140" cy="100" r="1.5"/><circle cx="180" cy="100" r="1.5"/>
    <circle cx="60" cy="140" r="1.5"/><circle cx="100" cy="140" r="1.5"/><circle cx="140" cy="140" r="1.5"/><circle cx="180" cy="140" r="1.5"/>
    <circle cx="60" cy="180" r="1.5"/><circle cx="100" cy="180" r="1.5"/><circle cx="140" cy="180" r="1.5"/><circle cx="180" cy="180" r="1.5"/>
    <circle cx="780" cy="400" r="1.5"/><circle cx="820" cy="400" r="1.5"/><circle cx="860" cy="400" r="1.5"/><circle cx="900" cy="400" r="1.5"/>
    <circle cx="780" cy="440" r="1.5"/><circle cx="820" cy="440" r="1.5"/><circle cx="860" cy="440" r="1.5"/><circle cx="900" cy="440" r="1.5"/>
    <circle cx="780" cy="480" r="1.5"/><circle cx="820" cy="480" r="1.5"/><circle cx="860" cy="480" r="1.5"/><circle cx="900" cy="480" r="1.5"/>
  </g>

  <!-- Left: Game Screen Simulation (Phone Container) -->
  <g transform="translate(60, 45)">
    <!-- Phone Mockup Frame -->
    <rect width="360" height="450" fill="#fbfaf6" stroke="#111111" stroke-width="3" class="shadow"/>

    <!-- In-Game HUD -->
    <rect x="0" y="0" width="360" height="85" fill="#f5f4ef" stroke="#111111" stroke-width="2"/>
    <text x="14" y="26" class="mono" font-size="14" font-weight="800" fill="#111111"><tspan fill="#0022ff">❯_</tspan> TOKEN SURVIVOR</text>
    
    <!-- Seed & Mute Badges -->
    <rect x="235" y="12" width="85" height="18" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="242" y="25" class="mono" font-size="10" font-weight="700" fill="#111111">SEED #88492</text>
    <rect x="326" y="12" width="20" height="18" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="330" y="25" font-size="10">🔊</text>

    <!-- Context Health Bar -->
    <rect x="14" y="38" width="332" height="16" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <rect x="14" y="38" width="270" height="16" fill="#0022ff"/>
    <line x1="200" y1="38" x2="200" y2="54" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 2"/>

    <text x="14" y="72" class="mono" font-size="11" font-weight="700" fill="#111111">Context: <tspan fill="#0022ff">82%</tspan></text>
    <text x="220" y="72" class="mono" font-size="11" font-weight="700" fill="#111111">Burned: <tspan fill="#e60000">468,200</tspan> TK</text>

    <!-- In-Game Hazards Falling -->
    <!-- 1. 429 Boulder -->
    <g transform="translate(90, 150)" class="shadow">
      <polygon points="0,-22 18,-15 24,6 12,22 -12,22 -24,6 -18,-15" fill="#e60000" stroke="#111111" stroke-width="2"/>
      <text x="0" y="5" class="mono" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">429</text>
      <!-- Floating damage tag -->
      <rect x="15" y="-30" width="105" height="18" fill="#ffffff" stroke="#e60000" stroke-width="1.5" class="shadow"/>
      <text x="20" y="-17" class="mono" font-size="9" font-weight="800" fill="#e60000">-20% 上下文 (429)</text>
    </g>

    <!-- 2. Nerf Beam -->
    <g transform="translate(280, 200)" class="shadow">
      <path d="M0,-18 L5,-5 L18,0 L5,5 L0,18 L-5,5 L-18,0 L-5,-5 Z" fill="#111111"/>
      <circle cx="0" cy="0" r="4" fill="#d4ff00"/>
      <!-- Floating nerf tag -->
      <rect x="-95" y="-12" width="85" height="18" fill="#111111" class="shadow"/>
      <text x="-90" y="1" class="mono" font-size="9" font-weight="800" fill="#d4ff00">📉 減速 40%</text>
    </g>

    <!-- 3. Safety Wall -->
    <g transform="translate(50, 260)" class="shadow">
      <rect x="0" y="0" width="220" height="24" fill="#666666" stroke="#111111" stroke-width="2"/>
      <text x="110" y="16" class="sans" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">身為大型語言模型，我無法協助...</text>
    </g>

    <!-- 4. Open Weights Collectible -->
    <g transform="translate(80, 360)" class="shadow">
      <polygon points="0,-12 12,-5 12,9 0,16 -12,9 -12,-5" fill="#0022ff" stroke="#111111" stroke-width="1.5"/>
      <text x="0" y="4" class="sans" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">📦</text>
      <rect x="18" y="-10" width="80" height="16" fill="#ffffff" stroke="#0022ff" stroke-width="1.5"/>
      <text x="22" y="2" class="mono" font-size="9" font-weight="800" fill="#0022ff">+25% 權重</text>
    </g>

    <!-- 5. Prompt Node (Player) -->
    <g transform="translate(200, 375)">
      <!-- Motion trailing ring -->
      <circle cx="0" cy="0" r="26" fill="none" stroke="#0022ff" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
      <circle cx="0" cy="0" r="20" fill="#0022ff" stroke="#111111" stroke-width="2.5" class="shadow"/>
      <text x="-2" y="6" class="mono" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">❯_</text>
    </g>

    <!-- 6. Leaked Key -->
    <g transform="translate(290, 340)" class="shadow">
      <circle cx="0" cy="0" r="12" fill="#e60000" stroke="#111111" stroke-width="1.5"/>
      <text x="0" y="4" font-size="11" text-anchor="middle">🔑</text>
    </g>
  </g>

  <!-- Right: Feature Typography & Viral Badges -->
  <g transform="translate(460, 60)">
    <!-- Title Section -->
    <rect x="0" y="0" width="130" height="22" fill="#0022ff"/>
    <text x="10" y="15" class="mono" font-size="11" font-weight="800" fill="#ffffff">ARCADE SURVIVAL</text>
    
    <text x="0" y="65" class="mono" font-size="36" font-weight="800" fill="#111111">TOKEN SURVIVOR</text>
    <text x="0" y="95" class="sans" font-size="18" font-weight="800" fill="#e60000">AI 巨獸限流生存戰 · 純前端極限對決</text>

    <!-- Punchy Description -->
    <text x="0" y="135" class="sans" font-size="13" fill="#333333" font-weight="600">
      <tspan x="0" dy="0">專為飽受各大 AI 巨獸「429 限流」、「無預警降智」、「審查拒絕」</tspan>
      <tspan x="0" dy="22">折磨的工程師打造。操控 Prompt Node，躲避巨獸砸毀，搶吃開源權重！</tspan>
    </text>

    <!-- Feature Grid Cards -->
    <g transform="translate(0, 185)">
      <!-- Feature 1 -->
      <g transform="translate(0, 0)">
        <rect width="215" height="70" fill="#ffffff" stroke="#111111" stroke-width="2" class="shadow"/>
        <text x="12" y="24" class="sans" font-size="12" font-weight="800" fill="#0022ff">⚡ 60fps 幀率無關引擎</text>
        <text x="12" y="45" class="mono" font-size="10" fill="#555555">Delta-Time 物理校準</text>
        <text x="12" y="58" class="mono" font-size="10" fill="#555555">高刷 120Hz/144Hz 跨端公平</text>
      </g>

      <!-- Feature 2 -->
      <g transform="translate(230, 0)">
        <rect width="215" height="70" fill="#ffffff" stroke="#111111" stroke-width="2" class="shadow"/>
        <text x="12" y="24" class="sans" font-size="12" font-weight="800" fill="#e60000">🎲 確定性 URL Seed</text>
        <text x="12" y="45" class="mono" font-size="10" fill="#555555">#seed=XXXXX 障礙 100% 同步</text>
        <text x="12" y="58" class="mono" font-size="10" fill="#555555">同局盤面挑機同事朋友</text>
      </g>

      <!-- Feature 3 -->
      <g transform="translate(0, 85)">
        <rect width="215" height="70" fill="#ffffff" stroke="#111111" stroke-width="2" class="shadow"/>
        <text x="12" y="24" class="sans" font-size="12" font-weight="800" fill="#111111">🎵 0KB 代碼合成音效</text>
        <text x="12" y="45" class="mono" font-size="10" fill="#555555">Web Audio 即時合成 8-Bit</text>
        <text x="12" y="58" class="mono" font-size="10" fill="#555555">零額外 mp3 下載、秒開秒玩</text>
      </g>

      <!-- Feature 4 -->
      <g transform="translate(230, 85)">
        <rect width="215" height="70" fill="#ffffff" stroke="#111111" stroke-width="2" class="shadow"/>
        <text x="12" y="24" class="sans" font-size="12" font-weight="800" fill="#0022ff">📄 9:16 體檢報告生成</text>
        <text x="12" y="45" class="mono" font-size="10" fill="#555555">Post-Mortem 機密文檔海報</text>
        <text x="12" y="58" class="mono" font-size="10" fill="#555555">一鍵下載直發 IG / 社群</text>
      </g>
    </g>

    <!-- Bottom Play Button Link Banner -->
    <g transform="translate(0, 365)" class="shadow">
      <rect width="445" height="42" fill="#d4ff00" stroke="#111111" stroke-width="2"/>
      <text x="222" y="26" class="mono" font-size="14" font-weight="800" fill="#111111" text-anchor="middle">🚀 PLAY LIVE ON GITHUB PAGES ❯</text>
    </g>
  </g>
</svg>
